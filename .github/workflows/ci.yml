name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install dependencies
        run: uv sync --dev
      # just comes from PyPI (rust-just), so no extra third-party action is needed.
      - name: Unit tests
        run: uvx --from rust-just just test
      - name: Validate run and score files against their LinkML schemas
        run: uvx --from rust-just just check
