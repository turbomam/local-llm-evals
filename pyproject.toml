[project]
name = "local-llm-evals"
version = "0.1.0"
description = "Run the same tasks on local and frontier LLMs and record every run"
authors = [
    { name = "Mark Andrew Miller", email = "MAM@lbl.gov" }
]
requires-python = ">=3.13"
dependencies = [
    "langfuse>=4.15.6",
    "nmdc-ai-eval",
    "openai>=3.19.2",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
]

[project.scripts]
local-llm-evals = "local_llm_evals:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "linkml>=1.11.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
nmdc-ai-eval = { git = "https://github.com/microbiomedata/nmdc-ai-eval", rev = "4e2fa04" }
