response: 'Photosynthesis is the process by which plants, algae, and some bacteria convert light energy
  into chemical energy stored in sugar molecules. It occurs primarily in the chloroplasts of plant cells,
  where the pigment chlorophyll captures sunlight.


  The process happens in two major stages.


  **Light-dependent reactions** take place in the thylakoid membranes inside the chloroplast. Chlorophyll
  and other pigments absorb photons, exciting electrons to higher energy levels. These energized electrons
  travel through an electron transport chain, and their energy is used to pump hydrogen ions across the
  membrane, creating a gradient that drives the enzyme ATP synthase to produce ATP. Water molecules are
  split (photolysis) to replace the lost electrons, releasing oxygen as a byproduct. The electron carrier
  NADP⁺ is reduced to NADPH. Together, ATP and NADPH carry the energy forward to the next stage.


  **The Calvin cycle** (light-independent reactions) occurs in the stroma of the chloroplast. Here, the
  enzyme RuBisCO fixes carbon dioxide from the air by attaching it to a five-carbon sugar called ribulose
  bisphosphate (RuBP), forming a six-carbon intermediate that immediately splits into two three-carbon
  molecules (3-phosphoglycerate). Using the ATP and NADPH produced earlier, these molecules are reduced
  into glyceraldehyde-3-phosphate (G3P). Some G3P molecules are used to regenerate RuBP so the cycle can
  continue, while others are combined to build glucose and other organic compounds the plant needs for
  growth and energy.


  The overall equation simplifies to: six CO₂ + six H₂O + light energy → C₆H₁₂O₆ + six O₂.


  Photosynthesis is foundational to nearly all life on Earth. It produces the oxygen we breathe, forms
  the base of most food chains, and continuously removes CO₂ from the atmosphere, playing a critical role
  in regulating the planet''s climate.'
