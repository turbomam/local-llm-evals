response: 'Photosynthesis is the process by which plants, algae, and some bacteria convert light energy
  into chemical energy stored in sugar molecules. It takes place primarily in the chloroplasts of plant
  cells, where a green pigment called chlorophyll absorbs sunlight.


  The overall reaction can be summarized as: carbon dioxide + water + light energy → glucose + oxygen.
  But this shorthand hides a two-stage process.


  **Light-Dependent Reactions**

  These occur in the thylakoid membranes of the chloroplast. Chlorophyll and other pigments in photosystems
  I and II absorb photons of light, exciting electrons to a higher energy state. Water molecules are split
  in a process called photolysis, releasing electrons, protons (H⁺), and oxygen as a byproduct. The excited
  electrons travel through an electron transport chain, and the energy they release pumps protons across
  the thylakoid membrane, creating a gradient. ATP synthase harnesses this gradient to produce ATP. Meanwhile,
  NADP⁺ is reduced to NADPH. So the light stage produces two energy carriers—ATP and NADPH—and releases
  O₂.


  **The Calvin Cycle (Light-Independent Reactions)**

  These take place in the stroma, the fluid surrounding the thylakoids. Here, the enzyme RuBisCO fixes
  atmospheric CO₂ by attaching it to a five-carbon sugar called ribulose bisphosphate (RuBP). The resulting
  six-carbon compound immediately splits into two three-carbon molecules (3-phosphoglycerate). Using the
  ATP and NADPH generated in the light stage, these molecules are reduced to glyceraldehyde-3-phosphate
  (G3P). Some G3P molecules are used to regenerate RuBP so the cycle can continue, while the rest are
  funneled into the production of glucose and other carbohydrates that the plant uses for energy, growth,
  and structure.


  In essence, photosynthesis captures solar energy, stores it in the bonds of sugar, and in the process
  releases the oxygen that most aerobic life depends on. It is the foundational energy source for nearly
  every food web on Earth.'
