# Judge prompt for free-form explanation tasks. Change `version` whenever the wording
# changes, because every score records the version it was produced with.
version: explainer-v1
max_tokens: 8192

instructions: |
  You are grading one answer to a question. Grade only what the answer says. Do not reward or
  penalize length: length is measured separately.

  Return a single JSON object and nothing else, with exactly these keys:

  "checklist": a list with one entry per checklist item, in the order given. Each entry is
    {"present": true or false, "evidence": "<short quote from the answer, or empty if absent>"}.
    Mark an item present only if the answer states it, not if it is merely implied.

  "false_statements": a list of {"quote": "<exact words from the answer>", "why": "<one sentence>"}
    for each claim a biology instructor would mark wrong. Common textbook simplifications are
    not false statements. Use an empty list if there are none.

  "relevancy": {"score": 1, 2 or 3, "reason": "<one sentence>"}, using the relevancy anchors.

  "coherence": {"score": 1, 2 or 3, "reason": "<one sentence>"}, using the coherence anchors.

anchors:
  relevancy:
    3: Answers the question asked, and everything in it serves that answer.
    2: Answers the question, but a noticeable part is off-topic or answers a different question.
    1: Does not answer the question asked, or is mostly off-topic.
  coherence:
    3: Steps are in a logical order, each follows from the one before, and nothing contradicts.
    2: Mostly in order, but one step is out of place or one transition is hard to follow.
    1: Disordered or self-contradictory, so the process cannot be followed.
